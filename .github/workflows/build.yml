name: Build game

on:
  push:
    branches: main

jobs:
  build:
    name: Build for (${{matrix.os}})
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Get commit hash
      id: vars
      shell: bash
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Install deps (linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libenet-dev build-essential cmake libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev xorg-dev
        git clone --depth 1 https://github.com/raysan5/raylib.git /tmp/raylib
        cd /tmp/raylib/src
        make PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=SHARED
        sudo make install

    - name: Install deps (macos)
      if: runner.os == 'MacOS'
      run: |
        brew install enet raylib

    - name: Setup MSYS2 (win)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msys2-location: C:\msys64
        update: true
        msystem: MINGW64

    - name: Install deps (win)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        pacman -S --noconfirm --needed \
          mingw-w64-x86_64-toolchain \
          mingw-w64-x86_64-enet \
          mingw-w64-x86_64-raylib

    - name: Build (linux/macos)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cc nob.c -o nob
        ./nob --release

    - name: Build (win)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        gcc nob.c -o nob.exe
        ./nob.exe --release

    - name: Upload client
      uses: actions/upload-artifact@v4
      with:
        name: miliways-client-${{matrix.os}}-${{steps.vars.outputs.sha_short}}
        path: build/client

    - name: Upload server
      uses: actions/upload-artifact@v4
      with:
        name: miliways-server-${{matrix.os}}-${{steps.vars.outputs.sha_short}}
        path: build/server